spring.application.name=RMAFlow

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Usuario ADMIN padrao criado no primeiro boot (ver AdminSeeder), caso nao exista nenhum ADMIN.
# ATENCAO: troque esta senha padrao assim que possivel apos o primeiro acesso em producao.
rmaflow.admin.login=admin
rmaflow.admin.senha-padrao=admin123

# EmailService (envio de e-mail da nota fiscal). SMTP lido de variaveis de ambiente - os defaults
# abaixo apontam para um servidor de teste local sem autenticacao (ex: MailHog, porta 1025).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
rmaflow.email.remetente=${MAIL_FROM:rmaflow@example.com}
