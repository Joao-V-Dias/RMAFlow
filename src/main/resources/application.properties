spring.application.name=RMAFlow

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Usuario ADMIN padrao criado no primeiro boot (ver AdminSeeder), caso nao exista nenhum ADMIN.
# ATENCAO: troque esta senha padrao assim que possivel apos o primeiro acesso em producao.
rmaflow.admin.login=admin
rmaflow.admin.senha-padrao=admin123
